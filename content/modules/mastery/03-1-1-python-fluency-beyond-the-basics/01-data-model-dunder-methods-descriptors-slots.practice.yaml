    why: This is the normative text every other explanation is derived from, and it is the only place the exact lookup and fallback rules are stated precisely.
    covers: Every special method, special-method lookup, `__slots__`, attribute access, and the operator fallback rules.

  - name: "Descriptor HowTo Guide"
    type: docs
    difficulty: core
    url: "https://docs.python.org/3/howto/descriptor.html"
    usefulness: 5
    why: Raymond Hettinger's guide builds descriptors from scratch and then shows pure-Python equivalents of `property`, `classmethod` and bound methods, which is the fastest route to seeing that they are all the same mechanism.
    covers: "`__get__`/`__set__`/`__set_name__`, data vs non-data precedence, and how functions become methods."

  - name: "dataclasses — the standard library's own answer"
    type: docs
    difficulty: core
    url: "https://docs.python.org/3/library/dataclasses.html"
    usefulness: 4
    why: Read this after building the project, not before — it is the production version of exactly what you will have written, and the `frozen` and `slots` sections confirm the design decisions you had to make yourself.
    covers: "Generated `__eq__`/`__repr__`/ordering, `frozen=True`, `slots=True`, and field defaults."

  - name: "PyTorch — torch.utils.data"
