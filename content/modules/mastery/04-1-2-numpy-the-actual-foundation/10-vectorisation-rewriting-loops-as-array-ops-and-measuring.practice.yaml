lessonId: "roadmap:phase-1-1.2:9"
module: 1-2-numpy-the-actual-foundation
lesson: 10-vectorisation-rewriting-loops-as-array-ops-and-measuring
title: "Vectorisation: rewriting loops as array ops, and measuring the speedup"
summary: Classify loops, preserve semantics, expose temporaries, and report speedup with correctness, latency, memory, dtype, and workload evidence.
mastery: {minAssessmentScore: 80, requireProject: true, requireInterview: true, requireDebug: true, revisitAfterDays: 21}
exercises:
  - {id: nvt-read-row-norm, tier: normal, kind: code-reading, title: Classify a row reduction, minutes: 10, requiredForMastery: true, concepts: [ufunc, reduction], prompt: "Read `np.sum(x*x,axis=1)` as loop families and derive output for x `(N,D)`.", hints: ["Multiplication is elementwise.", "Axis one is consumed."], solution: "A ufunc squares each element and a reduction sums features per row. Output is `(N,)`; accumulator dtype and overflow policy remain explicit decisions."}
  - {id: nvt-center-rows, tier: normal, kind: write-code, title: Vectorize row centering, minutes: 12, requiredForMastery: true, concepts: [broadcasting, keepdims], prompt: "Rewrite nested row-centering loops safely when N may equal C.", hints: ["Reduce classes on axis one.", "Retain the reduced position."], solution: "Use `x-x.mean(axis=1,keepdims=True)` and assert output `(N,C)` plus per-row mean near zero on rectangular and square fixtures."}
  - {id: nvt-gather-labels, tier: normal, kind: write-code, title: Gather class scores, minutes: 14, requiredForMastery: true, concepts: [gather, indexing], prompt: "For logits `(N,C)` and labels `(N,)`, replace a row loop that selects each true-class score.", hints: ["Build row indices once.", "Pair row and class arrays."], solution: "Validate integer labels in bounds, then use `logits[np.arange(N),labels]`; result is `(N,)`. Test duplicate labels and boundary classes."}
  - {id: nvt-benchmark-boundary, tier: normal, kind: explain, title: Define a fair timing boundary, minutes: 10, requiredForMastery: true, concepts: [benchmark, fairness], prompt: "State what must match when comparing loop and vectorized candidates.", hints: ["Inputs and required outputs must match.", "Include or exclude conversion consistently."], solution: "Freeze workload distribution, input ownership, dtype, semantic output, conversion, allocation, threading, and correctness tolerance; warm both and run repeated randomized-order trials."}
  - {id: nvt-pairwise-algebra, tier: intermediate, kind: write-code, title: Avoid a three-dimensional temporary, minutes: 20, requiredForMastery: true, concepts: [pairwise-distance, matmul, memory], prompt: "Rewrite all-pairs squared distances without materializing `(N,M,D)`.", hints: ["Expand the squared-distance identity.", "Keep norms as broadcastable columns and rows."], solution: "Compute `sum(x*x,1,keepdims=True)+sum(y*y,1)[None,:]-2*x@y.T`, clip tiny negative roundoff, and compare accuracy plus peak memory with the broadcast reference."}
  - {id: nvt-chunked-mean, tier: intermediate, kind: write-code, title: Bound absolute-mean memory, minutes: 18, requiredForMastery: true, concepts: [chunking, accumulator], prompt: "Compute mean absolute value without a full-size temporary and define empty behavior.", hints: ["Vectorize inside large chunks.", "Accumulate count and a safe total."], solution: "Iterate over bounded slices, sum `abs(chunk)` with deliberate float64 accumulation, track total count, reject empty input, and benchmark chunk sizes including peak memory."}
  - {id: nvt-mask-vs-filter, tier: intermediate, kind: performance, title: Compare masked strategies, minutes: 18, requiredForMastery: true, concepts: [mask, where, allocation], prompt: "Compare `x[mask]` then reduce with a `where` reduction.", hints: ["Boolean indexing packs a copy.", "Where may scan all elements."], solution: "Measure selection density, latency, and peak memory. Packed selection allocates proportional to matches but may reduce less; where avoids packing yet scans the domain. Preserve identical empty and dtype policies."}
  - {id: nvt-design-harness, tier: intermediate, kind: design, title: Build a credible benchmark harness, minutes: 20, requiredForMastery: true, concepts: [timing, memory, correctness], prompt: "Design a harness for loop, vectorized, and chunked candidates.", hints: ["Warm and repeat in randomized order.", "Validate results outside timed regions consistently."], solution: "Record environment, shapes, strides, dtype, thread settings, timing distribution, throughput, peak memory, and error against one oracle. Separate setup and end-to-end modes explicitly."}
  - {id: nvt-debug-wrong-axis, tier: tricky, kind: debug, title: Expose square-shape normalization, minutes: 16, requiredForMastery: true, concepts: [axis, silent-bug], prompt: "A vectorized normalizer reduces axis zero instead of features but passes `(32,32)` tests. Repair the proof.", hints: ["Name batch and feature axes.", "Use unequal sizes and per-row invariants."], solution: "Reduce axis one with keepdims, use asymmetric fixtures and a square regression, and assert every row's intended mean or norm rather than shape alone."}
  - {id: nvt-debug-huge-temporary, tier: tricky, kind: debug, title: Remove an all-pairs explosion, minutes: 18, requiredForMastery: true, concepts: [broadcasting, temporary], prompt: "`x[:,None,:]-y[None,:,:]` exhausts memory. Diagnose bytes and repair under a fixed budget.", hints: ["Multiply N*M*D*itemsize.", "Use algebraic or chunked blocks."], solution: "Account for delta and squared temporaries, use norm-plus-matmul when its error is acceptable or compute blocks bounded by budget, and benchmark peak live memory."}
  - {id: nvt-debug-inplace-view, tier: tricky, kind: debug, title: Stop alias corruption, minutes: 16, requiredForMastery: true, concepts: [view, in-place], prompt: "An in-place optimization modifies the caller's base array through a slice. Repair ownership.", hints: ["Inspect shares_memory.", "Copy at the ownership boundary when mutation is not promised."], solution: "Treat borrowed arrays as immutable, allocate an owned output or document destructive semantics, and test base data remains unchanged for sliced and transposed inputs."}
  - {id: nvt-debug-unfair-timing, tier: tricky, kind: debug, title: Repair a dishonest speedup, minutes: 16, requiredForMastery: true, concepts: [benchmark, setup], prompt: "Loop timing includes file conversion while vectorized timing starts from an ndarray. Redesign the comparison.", hints: ["Choose algorithm-only or end-to-end scope.", "Apply it symmetrically."], solution: "Prepare identical arrays outside both algorithm timings and separately benchmark both full pipelines including conversion. Report both rather than mixing boundaries."}
  - {id: nvt-design-vectorization-review, tier: challenge, kind: design, title: Design an optimization review record, minutes: 26, requiredForMastery: false, concepts: [evidence, regression], prompt: "Define evidence required before merging a vectorization rewrite.", hints: ["Correctness comes before speed.", "Capture workload and memory, not one ratio."], solution: "Require semantic derivation, independent oracle, adversarial equivalence, shape/dtype/layout distributions, environment and threads, repeated latency percentiles, throughput, peak memory, error, and regression thresholds."}
  - {id: nvt-benchmark-bandwidth, tier: challenge, kind: performance, title: Diagnose a bandwidth-bound kernel, minutes: 26, requiredForMastery: false, concepts: [bandwidth, fusion, roofline], prompt: "A chain of simple ufuncs stops scaling with more cores. Design diagnostics and alternatives.", hints: ["Estimate bytes moved per element.", "Compare fused, in-place-owned, and chunked paths."], solution: "Measure bandwidth, CPU utilization, temporaries, and thread scaling; compare safe out buffers, expression fusion tools or compiled loops, and chunks. Select from end-to-end latency, memory, and maintainability."}
quizzes:
  - id: nvt-checkpoint
    title: Checkpoint — honest vectorization
    kind: checkpoint
    passScore: 75
    questions:
      - {id: nvt-cp-reduction, kind: mcq, prompt: "Which operation replaces accumulation over one axis?", options: [{id: reduction, text: Reduction}, {id: transpose, text: Transpose}], answer: [reduction], explanation: "Reductions combine an axis.", concepts: [reduction], points: 1}
      - {id: nvt-cp-temp, kind: mcq, prompt: "Largest broadcast distance temporary?", options: [{id: nmd, text: "(N,M,D)"}, {id: nd, text: "(N,D)"}], answer: [nmd], explanation: "Pairwise feature differences span all three axes.", concepts: [memory], points: 1}
      - {id: nvt-cp-proof, kind: multi, prompt: "What belongs with speedup?", options: [{id: correctness, text: Correctness}, {id: memory, text: Peak memory}, {id: latency, text: Timing distribution}, {id: lines, text: Line count}], answer: [correctness, memory, latency], explanation: "Conciseness is not performance evidence.", concepts: [benchmark], points: 1}
      - {id: nvt-cp-always, kind: true-false, prompt: "Is whole-array vectorization always fastest?", options: [{id: "true", text: "True"}, {id: "false", text: "False"}], answer: ["false"], explanation: "Temporaries, skipped work, and bandwidth can dominate.", concepts: [tradeoff], points: 1}
  - id: nvt-assessment
    title: Assessment — array rewrite and measurement
    kind: assessment
    passScore: 80
    questions:
      - {id: nvt-as-classify, kind: explain, prompt: "Map loop families to array operations.", modelAnswer: "Elementwise to ufunc, accumulation to reduction, independent pair axes to broadcasting, indexed lookup to gather, dot loops to matmul/einsum.", explanation: "Classification guides a semantic rewrite.", concepts: [classification], points: 1}
      - {id: nvt-as-center, kind: find-bug, prompt: "Why can dropped row means corrupt square data?", modelAnswer: "Rank-one means align with the trailing feature axis when N=C; keep axis one as `(N,1)`.", explanation: "Broadcasting knows sizes, not meanings.", concepts: [broadcasting], points: 1}
      - {id: nvt-as-pairwise, kind: scenario, prompt: "How avoid `(N,M,D)` distances?", modelAnswer: "Use row norms plus matrix multiplication or bounded blocks, then validate cancellation error.", explanation: "Algebra trades temporary memory for numerical behavior.", concepts: [distance], points: 1}
      - {id: nvt-as-chunk, kind: scenario, prompt: "When does chunking help?", modelAnswer: "When full intermediates exceed memory or cache budgets while kernels can still process large blocks efficiently.", explanation: "Python dispatch is amortized per chunk.", concepts: [chunking], points: 1}
      - {id: nvt-as-benchmark, kind: explain, prompt: "Why warm candidates?", modelAnswer: "To exclude one-time imports, allocation setup, caches, and thread-pool initialization from steady-state comparison.", explanation: "First-run cost is a separate metric.", concepts: [warmup], points: 1}
      - {id: nvt-as-threads, kind: scenario, prompt: "Why record BLAS threads?", modelAnswer: "Thread count changes latency, contention, oversubscription, and reproducibility of measurements.", explanation: "Environment is part of benchmark evidence.", concepts: [threads], points: 1}
      - {id: nvt-as-dtype, kind: find-bug, prompt: "Why can a rewrite change values?", modelAnswer: "It may change promotion, accumulator dtype, overflow, or floating reduction order.", explanation: "Semantic equivalence includes numerical policy.", concepts: [dtype], points: 1}
      - {id: nvt-as-inplace, kind: true-false, prompt: "Is in-place safe on any ndarray slice?", options: [{id: "true", text: "True"}, {id: "false", text: "False"}], answer: ["false"], explanation: "Slices may alias caller-owned bases.", concepts: [aliasing], points: 1}
      - {id: nvt-as-oracle, kind: scenario, prompt: "What is a useful rewrite oracle?", modelAnswer: "A clear bounded loop with frozen semantics and adversarial fixtures, not another equivalent vector expression sharing the bug.", explanation: "Independent structure reduces shared mistakes.", concepts: [testing], points: 1}
      - {id: nvt-as-report, kind: refactor, prompt: "Replace '20x faster' with honest evidence.", modelAnswer: "Report workload distribution, hardware, versions, threads, timing percentiles, throughput, peak memory, dtype, and maximum error against the oracle.", explanation: "A ratio without context is not reproducible.", concepts: [reporting], points: 1}
interview:
  - {id: nvt-iv-meaning, level: basic, requiredForMastery: true, concepts: [vectorization], question: "What is vectorization?", shortAnswer: "Moving iteration from Python into larger typed array kernels.", fullAnswer: "It amortizes interpreter dispatch but retains arithmetic, memory traffic, allocation, and numerical policy.", commonWrongAnswer: "It eliminates loops and work.", followUps: ["Where do loops execute?", "What can dominate instead?"]}
  - {id: nvt-iv-rewrite, level: intermediate, requiredForMastery: true, concepts: [classification], question: "How do you rewrite a loop safely?", shortAnswer: "Classify its index relationships, freeze semantics, choose matching array primitives, and compare with an oracle.", fullAnswer: "I derive output shape, dtype, order, empty behavior, and aliases before optimizing, then use adversarial tests.", commonWrongAnswer: "Replace every for with broadcasting.", followUps: ["Which loops map poorly?", "How catch wrong axes?"]}
  - {id: nvt-iv-memory, level: advanced, requiredForMastery: true, concepts: [memory], question: "How can broadcasting exhaust memory?", shortAnswer: "Inputs may be logical views while the resulting operation materializes a huge output or temporary.", fullAnswer: "I calculate every intermediate shape times item size and measure peak live memory; algebra or chunking may be safer.", commonWrongAnswer: "Broadcasting never allocates anything.", followUps: ["Give a pairwise example.", "What can algebra change numerically?"]}
  - {id: nvt-iv-benchmark, level: advanced, requiredForMastery: true, concepts: [benchmark], question: "What makes a credible speedup?", shortAnswer: "Equivalent work and outputs, representative inputs, warm repeated trials, controlled threads, and memory plus error evidence.", fullAnswer: "I state boundaries and report distributions, not one stopwatch value, with environment and workload metadata.", commonWrongAnswer: "One timeit result proves production speed.", followUps: ["How handle setup?", "Which percentile matters?"]}
  - {id: nvt-iv-numerics, level: tricky, requiredForMastery: true, concepts: [numerics], question: "Why can a correct rewrite differ numerically?", shortAnswer: "Promotion, accumulator dtype, and operation order may change.", fullAnswer: "I define overflow and tolerance policy, compare against higher-quality references, and assert domain invariants.", commonWrongAnswer: "Same formula means bit-identical floats.", followUps: ["How test integers?", "When is clipping valid?"]}
  - {id: nvt-iv-not-vectorize, level: scenario, requiredForMastery: true, concepts: [tradeoff], question: "When would you keep or compile a loop?", shortAnswer: "For recurrences, early exits, irregular state, or when whole-array temporaries exceed budgets.", fullAnswer: "I may keep a clear outer loop with vectorized chunks or use a compiled specialized kernel after measuring the complete pipeline.", commonWrongAnswer: "Python loops are never acceptable near NumPy.", followUps: ["How choose chunk size?", "When use a library primitive?"]}
projects:
  - id: nvt-project-optimization-lab
    kind: major
    title: Build an evidence-backed vectorization lab
    minutes: 280
    summary: Rewrite a feature and distance pipeline while preserving contracts and measuring full execution cost.
    problem: "Optimize a NumPy preprocessing pipeline containing element loops, row normalization, label gathers, masked metrics, and pairwise distances."
    requirements: ["Keep a bounded loop oracle for every rewrite.", "Implement vectorized and memory-bounded chunked candidates.", "Derive shapes, dtypes, and intermediate-byte estimates.", "Benchmark representative shape distributions with controlled threads.", "Report latency percentiles, throughput, peak memory, and numerical error."]
    constraints: ["No benchmark-boundary mismatch.", "No whole-array temporary above budget.", "No in-place mutation of borrowed arrays."]
    expectedBehaviour: ["All candidates meet semantic invariants.", "Square and asymmetric cases behave identically by meaning.", "Chosen implementation meets latency and memory budgets."]
    structure: "optimization_lab/ oracle.py vectorized.py chunked.py benchmark.py report.py; tests/"
    milestones: [{title: "1 — Freeze contracts", detail: "Write oracles and adversarial fixtures."}, {title: "2 — Rewrite", detail: "Implement array and chunked candidates."}, {title: "3 — Measure", detail: "Capture performance, memory, and error."}]
    testing: ["Cover empty, singleton, square, non-contiguous, extreme, and large inputs.", "Assert dtype, ownership, shape, values, and invariants."]
    failureCases: ["Wrong-axis broadcast.", "Pairwise temporary explosion.", "Unfair timing scope."]
    bonus: ["Add automated regression thresholds by workload class."]
    architectureHints: ["Separate benchmark setup from execution.", "Keep reports machine-readable."]
    referenceOutline: "Freeze loop behavior, derive vector primitives, estimate intermediates, add chunking, and select only after equivalent outputs and representative measurements."
  - id: nvt-final-speedup-audit
    kind: final-challenge
    title: Repair eight dishonest optimization claims
    minutes: 90
    summary: Expose semantic, allocation, alias, dtype, threading, warm-up, scope, and workload defects.
    problem: "Audit a claimed 30x rewrite and prove eight independent causes before repairing its benchmark and implementation."
    requirements: ["Cover wrong axis, huge temporary, aliased in-place write, dtype change, uncontrolled threads, missing warm-up, unequal timing scope, and toy workload."]
    constraints: ["Do not retain a speed claim without reproducible evidence.", "Do not weaken correctness to win timing."]
    expectedBehaviour: ["Eight causes have fail-before-fix evidence.", "Final report includes correctness, latency, memory, and error."]
    milestones: [{title: "1 — Freeze truth", detail: "Restore semantic oracle."}, {title: "2 — Expose claims", detail: "Add eight regressions."}, {title: "3 — Remeasure", detail: "Apply focused fixes and publish evidence."}]
    testing: ["Use real shape distribution and adversarial values.", "Repeat with controlled thread settings."]
    failureCases: ["Timing different boundaries.", "Ignoring peak live temporaries."]
    bonus: ["Generate a benchmark provenance manifest."]
    architectureHints: ["Separate correctness and performance gates."]
    referenceOutline: "Reconstruct the fair boundary, prove semantic equality, account for allocations and environment, then compare loop, vector, and chunked paths."
resources:
  - {name: NumPy broadcasting guide, type: docs, difficulty: core, url: "https://numpy.org/doc/stable/user/basics.broadcasting.html", usefulness: 5, why: "It is the primary shape rule behind vectorized singleton expansion and its common memory traps.", covers: "Trailing-axis compatibility, singleton expansion, examples, and caveats."}
  - {name: NumPy ufunc basics, type: docs, difficulty: core, url: "https://numpy.org/doc/stable/user/basics.ufuncs.html", usefulness: 5, why: "It explains the compiled elementwise loop model, output controls, type casting, and reduction methods.", covers: "Ufunc execution, broadcasting, casting, out, reduce, accumulate, and outer."}
  - {name: NumPy copies and views, type: docs, difficulty: deep, url: "https://numpy.org/doc/stable/user/basics.copies.html", usefulness: 5, why: "It provides the ownership and aliasing rules needed before in-place optimization or temporary accounting.", covers: "Views, copies, indexing, reshape, base ownership, and memory sharing."}
  - {name: NumPy vectorize reference, type: docs, difficulty: core, url: "https://numpy.org/doc/stable/reference/generated/numpy.vectorize.html", usefulness: 5, why: "It explicitly distinguishes convenient Python-loop broadcasting from true performance vectorization, preventing a common optimization misconception.", covers: "Callable broadcasting, signatures, excluded arguments, caching, output types, and performance limitations."}
  - {name: NumPy CPU and SIMD optimizations, type: docs, difficulty: deep, url: "https://numpy.org/doc/stable/reference/simd/index.html", usefulness: 4, why: "It documents the compiled SIMD layer that explains why typed contiguous inner loops can outperform Python iteration.", covers: "CPU features, SIMD dispatch, intrinsics, build support, and runtime behavior."}
