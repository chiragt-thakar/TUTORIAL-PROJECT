lessonId: "roadmap:phase-1-1.2:8"
module: 1-2-numpy-the-actual-foundation
lesson: 09-random-number-generation-and-seeding-for-reproducibility
title: "Random number generation and seeding for reproducibility"
summary: Own generator state, derive independent streams, define replay scope, and test stochastic behavior without ambient call-order coupling.
mastery: {minAssessmentScore: 80, requireProject: true, requireInterview: true, requireDebug: true, revisitAfterDays: 21}
exercises:
  - {id: nrg-read-state-advance, tier: normal, kind: code-reading, title: Trace generator state, minutes: 10, requiredForMastery: true, concepts: [generator, state], prompt: "Two functions share one Generator. Explain why inserting a draw in the first changes the second function's output.", hints: ["A generator is mutable state.", "Every draw advances the shared stream."], solution: "The second function observes a later state after the inserted draw. A common seed gives deterministic coupling, not isolation; give independent components derived child streams."}
  - {id: nrg-inject-generator, tier: normal, kind: refactor, title: Remove global randomness, minutes: 12, requiredForMastery: true, concepts: [dependency-injection, global-state], prompt: "Refactor a helper using `np.random.normal` so its caller owns randomness.", hints: ["Accept a Generator parameter.", "Construct it at the experiment boundary."], solution: "Add a keyword-only rng parameter and call rng.normal. Tests inject a seeded generator or fake; production constructs and records it once outside the helper."}
  - {id: nrg-derive-two-streams, tier: normal, kind: write-code, title: Separate shuffle and augmentation, minutes: 14, requiredForMastery: true, concepts: [seed-sequence, spawn], prompt: "Derive reproducible independent shuffle and augmentation streams from one experiment identity.", hints: ["Create one SeedSequence.", "Spawn children in a documented mapping."], solution: "Create `root=SeedSequence(identity)`, spawn two children, build one default_rng per child, and record entropy plus spawn keys. Prove extra augmentation draws do not alter shuffle."}
  - {id: nrg-bound-integers, tier: normal, kind: predict-output, title: State integer endpoint policy, minutes: 10, requiredForMastery: true, concepts: [integers, bounds], prompt: "For `rng.integers(0,10,size=...)`, state possible values and the invariant to test.", hints: ["High is excluded by default.", "Test bounds rather than exact frequencies on a tiny sample."], solution: "Values are integers from 0 through 9. Assert dtype and `0 <= values < 10`; statistical uniformity needs a separately designed large-sample test."}
  - {id: nrg-parallel-shards, tier: intermediate, kind: design, title: Derive logical-shard streams, minutes: 20, requiredForMastery: true, concepts: [parallel, topology], prompt: "Design streams for stable shard ids when process scheduling changes.", hints: ["Do not use completion order.", "Mix root identity with stable shard identity."], solution: "Derive each child SeedSequence from versioned experiment identity and unique logical shard id, give each task one Generator, reject duplicate ids, and test shuffled scheduling produces the same per-shard results."}
  - {id: nrg-capture-replay-state, tier: intermediate, kind: write-code, title: Replay a late failure, minutes: 18, requiredForMastery: true, concepts: [state, replay], prompt: "Capture enough state immediately before a failing sample and reproduce it in a fresh generator.", hints: ["Record BitGenerator class and state.", "Restore before repeating the same distribution call."], solution: "Serialize a versioned copy of rng.bit_generator.state plus algorithm, NumPy version, and call parameters. Construct the matching BitGenerator, restore state, repeat the call, and assert equality inside the supported environment."}
  - {id: nrg-split-invariants, tier: intermediate, kind: write-code, title: Test a randomized split, minutes: 18, requiredForMastery: true, concepts: [permutation, invariants], prompt: "Create train and validation indices and test correctness without depending only on one exact permutation.", hints: ["Permute indices once.", "Assert disjointness, coverage, size, and bounds."], solution: "Use an injected rng.permutation, slice by declared split size, and assert unique union equals all indices, intersection is empty, sizes match, and rerunning from recorded state reproduces the split."}
  - {id: nrg-statistical-moments, tier: intermediate, kind: design, title: Test normal samples responsibly, minutes: 20, requiredForMastery: true, concepts: [statistical-test, tolerance], prompt: "Design a non-flaky mean and variance check for normal draws.", hints: ["Derive uncertainty from sample count.", "Declare acceptable false-positive risk."], solution: "Choose n and thresholds from standard errors, use a fixed test stream for deterministic CI behavior, verify shape and finiteness separately, and avoid dozens of uncorrected moment checks that inflate false failures."}
  - {id: nrg-debug-reseed-helper, tier: tricky, kind: debug, title: Stop repeated noise, minutes: 16, requiredForMastery: true, concepts: [reseed, ownership], prompt: "A helper calls `default_rng(42)` internally and returns identical noise every call. Repair ownership.", hints: ["Construction restarts state.", "Inject one advancing generator."], solution: "Move construction to the caller and pass rng into the helper. Test consecutive calls differ while reconstructing from the same root reproduces the full sequence."}
  - {id: nrg-debug-worker-clones, tier: tricky, kind: debug, title: Remove duplicate worker samples, minutes: 18, requiredForMastery: true, concepts: [workers, duplicated-stream], prompt: "Every worker receives seed 42 and produces duplicate batches. Make streams distinct and replayable.", hints: ["One seed copied means one state copied.", "Use structured child derivation."], solution: "Spawn or deterministically derive child SeedSequences from root plus stable logical worker or task ids, record mappings, and test non-overlap plus per-task replay under reordered execution."}
  - {id: nrg-debug-shared-evaluation, tier: tricky, kind: debug, title: Isolate evaluation draws, minutes: 18, requiredForMastery: true, concepts: [call-order, stream-isolation], prompt: "Adding evaluation frequency changes training shuffles because both share one rng. Repair the stream graph.", hints: ["Evaluation consumes training state.", "Named subsystem streams remove coupling."], solution: "Spawn independent training and evaluation streams from the experiment root. Prove changing evaluation draw count leaves every training shuffle unchanged."}
  - {id: nrg-debug-flaky-frequency, tier: tricky, kind: debug, title: Repair a flaky uniformity test, minutes: 18, requiredForMastery: true, concepts: [flaky-test, sampling-error], prompt: "A test demands exactly 50 heads from 100 fair flips. Diagnose its false-failure contract.", hints: ["Random counts vary around expectation.", "Use derived intervals or deterministic seams."], solution: "Exact equality is not a distribution invariant. For algorithm tests inject controlled draws; for statistical validation choose a larger n and binomial-derived acceptance region with documented alpha."}
  - {id: nrg-design-stream-registry, tier: challenge, kind: design, title: Design a stream registry, minutes: 28, requiredForMastery: false, concepts: [registry, versioning, topology], prompt: "Design versioned named streams for a multi-stage experiment platform.", hints: ["Separate root identity from subsystem and task paths.", "Make collisions and topology changes observable."], solution: "Define canonical component names and stable task ids, derive SeedSequences through recorded paths, forbid duplicate ownership, expose algorithm/state metadata, and version mappings so a refactor cannot silently reassign existing streams."}
  - {id: nrg-benchmark-sampling, tier: challenge, kind: performance, title: Benchmark sampling pipelines, minutes: 24, requiredForMastery: false, concepts: [performance, allocation], prompt: "Compare scalar-loop, bulk, and chunked sampling without changing the generated workload contract.", hints: ["Match distribution, count, dtype, and state start.", "Measure allocation and downstream consumption."], solution: "Clone equivalent initial states, warm paths, time repeated complete pipelines, record throughput and peak memory, validate bounds and statistical summaries, and explain that sequence equality may differ when algorithms consume raw bits differently."}
quizzes:
  - id: nrg-checkpoint
    title: Checkpoint — state and streams
    kind: checkpoint
    passScore: 75
    questions:
      - {id: nrg-cp-api, kind: mcq, prompt: "Which object provides distribution methods?", options: [{id: generator, text: Generator}, {id: seed, text: SeedSequence}], answer: [generator], explanation: "Generator exposes sampling APIs.", concepts: [generator], points: 1}
      - {id: nrg-cp-spawn, kind: mcq, prompt: "Best source for structured child streams?", options: [{id: spawn, text: SeedSequence spawn}, {id: copy, text: Copy one identical seed}], answer: [spawn], explanation: "Spawn records distinct derivation paths.", concepts: [seed-sequence], points: 1}
      - {id: nrg-cp-global, kind: true-false, prompt: "Does one global seed isolate components?", options: [{id: "true", text: "True"}, {id: "false", text: "False"}], answer: ["false"], explanation: "Shared call order couples them.", concepts: [global-state], points: 1}
      - {id: nrg-cp-record, kind: multi, prompt: "What supports exact replay?", options: [{id: algorithm, text: "BitGenerator"}, {id: state, text: "State/checkpoint"}, {id: version, text: "NumPy version"}, {id: color, text: "Chart color"}], answer: [algorithm, state, version], explanation: "Replay depends on algorithm, state, call, and environment.", concepts: [replay], points: 1}
  - id: nrg-assessment
    title: Assessment — reproducible randomness
    kind: assessment
    passScore: 80
    questions:
      - {id: nrg-as-generator, kind: explain, prompt: "Separate Generator and BitGenerator roles.", modelAnswer: "Generator implements distributions; BitGenerator owns and advances raw pseudorandom state.", explanation: "The API and engine are separate.", concepts: [architecture], points: 1}
      - {id: nrg-as-seedsequence, kind: explain, prompt: "What does SeedSequence add?", modelAnswer: "It robustly mixes entropy and derives reproducible child sequences with spawn paths.", explanation: "It models stream topology.", concepts: [seed-sequence], points: 1}
      - {id: nrg-as-callorder, kind: find-bug, prompt: "Why did a debug draw alter training?", modelAnswer: "It consumed shared generator state; isolate diagnostic and training streams.", explanation: "Shared state couples call order.", concepts: [isolation], points: 1}
      - {id: nrg-as-workers, kind: scenario, prompt: "How seed reordered logical tasks?", modelAnswer: "Derive each stream from root plus stable task identity, not scheduling order.", explanation: "Logical topology survives process scheduling.", concepts: [parallel], points: 1}
      - {id: nrg-as-state, kind: scenario, prompt: "Why capture late generator state?", modelAnswer: "It resumes immediately before failure without replaying every prior draw.", explanation: "Initial seed alone may require exact call history.", concepts: [state], points: 1}
      - {id: nrg-as-version, kind: true-false, prompt: "Does the same seed guarantee identical distributions across all versions?", options: [{id: "true", text: "True"}, {id: "false", text: "False"}], answer: ["false"], explanation: "Distribution implementations and code paths can change.", concepts: [versioning], points: 1}
      - {id: nrg-as-bounds, kind: predict-output, prompt: "Possible values from integers(2,5)?", modelAnswer: "2, 3, or 4; high is excluded by default.", explanation: "Endpoint policy is explicit.", concepts: [integers], points: 1}
      - {id: nrg-as-split, kind: scenario, prompt: "Which split invariants matter?", modelAnswer: "Sizes, bounds, uniqueness, disjointness, full coverage, and recorded replay.", explanation: "Exact one-seed values are not the only correctness evidence.", concepts: [invariants], points: 1}
      - {id: nrg-as-flaky, kind: find-bug, prompt: "Why is exactly half heads invalid?", modelAnswer: "A fair process has sampling variance; equality creates high false failures.", explanation: "Statistical tests need derived thresholds.", concepts: [statistics], points: 1}
      - {id: nrg-as-contract, kind: refactor, prompt: "Define an exact replay contract.", modelAnswer: "Pin root/child identity, algorithm, state or call sequence, parameters, shapes, dtype, topology, NumPy and platform determinism settings.", explanation: "Seed alone is incomplete.", concepts: [contract], points: 1}
interview:
  - {id: nrg-iv-seed, level: basic, requiredForMastery: true, concepts: [seed], question: "Why is a seed insufficient?", shortAnswer: "It initializes state but does not specify algorithm, ownership, call order, topology, or versions.", fullAnswer: "I define the replay scope and record every dependency that can alter draws or downstream execution.", commonWrongAnswer: "Calling seed once guarantees the whole application.", followUps: ["What would you record?", "What changes across versions?"]}
  - {id: nrg-iv-ownership, level: intermediate, requiredForMastery: true, concepts: [ownership], question: "How should libraries receive randomness?", shortAnswer: "Through an injected Generator owned by the caller.", fullAnswer: "Construction belongs at an experiment boundary; components get isolated derived streams and do not mutate ambient global state.", commonWrongAnswer: "Every helper should create default_rng(42).", followUps: ["How do tests inject it?", "When is a fake useful?"]}
  - {id: nrg-iv-parallel, level: advanced, requiredForMastery: true, concepts: [parallel], question: "How do you avoid duplicate parallel streams?", shortAnswer: "Derive children from one root using stable logical identities.", fullAnswer: "I record spawn paths, reject duplicate task ids, and test reordered scheduling. Physical worker ids are unsuitable when topology changes.", commonWrongAnswer: "Give every worker the experiment seed.", followUps: ["What if worker count changes?", "How do you replay one shard?"]}
  - {id: nrg-iv-state, level: tricky, requiredForMastery: true, concepts: [state], question: "Seed or state for failure replay?", shortAnswer: "Use a bounded state checkpoint near the failure plus algorithm and environment metadata.", fullAnswer: "A seed needs the exact preceding call history; state restores the stream locally. Serialization must be versioned and protected.", commonWrongAnswer: "The seed always jumps directly to the failure.", followUps: ["Is state sensitive?", "What call metadata is needed?"]}
  - {id: nrg-iv-testing, level: advanced, requiredForMastery: true, concepts: [testing], question: "How do you test stochastic code?", shortAnswer: "Separate deterministic seams, domain invariants, and statistical properties.", fullAnswer: "Inject state for exact algorithm tests, assert bounds and coverage always, and use derived statistical thresholds with controlled false-positive risk.", commonWrongAnswer: "Assert one exact sample everywhere.", followUps: ["How prevent flaky tests?", "Which invariants suit data splits?"]}
  - {id: nrg-iv-production, level: scenario, requiredForMastery: true, concepts: [observability], question: "What RNG metadata belongs in an experiment record?", shortAnswer: "Root identity, algorithm, child paths, versions, topology, and determinism policy.", fullAnswer: "For failure replay I also retain bounded state and exact call parameters while avoiding raw sensitive sampled data.", commonWrongAnswer: "Only write seed=42.", followUps: ["How version stream names?", "What if NumPy upgrades?"]}
projects:
  - id: nrg-project-experiment-rng
    kind: major
    title: Build a replayable experiment RNG service
    minutes: 260
    summary: Provide named subsystem and task streams with replay metadata and tests for isolation and topology.
    problem: "Build a NumPy RNG layer for splitting, shuffling, augmentation, evaluation, and parallel workers without global state."
    requirements: ["Use Generator, explicit BitGenerator, and SeedSequence.", "Provide versioned named child streams and stable logical-task derivation.", "Capture bounded replay checkpoints.", "Record environment and topology metadata.", "Test subsystem isolation, scheduling reorder, split invariants, and statistical contracts."]
    constraints: ["No np.random.seed or ambient global calls.", "No identical seed copied across workers.", "No raw sample logging as replay strategy."]
    expectedBehaviour: ["Extra draws in one subsystem do not shift another.", "Logical tasks reproduce under reordered scheduling.", "Failures replay from a checkpoint.", "Invalid duplicate identities fail clearly."]
    structure: "experiment_rng/ registry.py streams.py replay.py sampling.py metadata.py; tests/"
    milestones: [{title: "1 — Stream graph", detail: "Define versioned ownership and derivation."}, {title: "2 — Sampling seams", detail: "Inject generators into domain functions."}, {title: "3 — Replay and tests", detail: "Capture state and prove isolation."}]
    testing: ["Test exact replay in a pinned environment.", "Assert split and sampling invariants.", "Test reordered task execution and duplicate ids."]
    failureCases: ["Shared stream call-order coupling.", "Cloned worker state.", "Flaky exact-frequency assertion."]
    bonus: ["Add a CLI that replays one recorded shard."]
    architectureHints: ["Keep construction at the composition root.", "Separate stream names from physical workers."]
    referenceOutline: "Build a root SeedSequence registry, derive subsystem and task children, inject Generators, and serialize versioned state plus environment evidence for replay."
  - id: nrg-final-rng-audit
    kind: final-challenge
    title: Repair eight reproducibility defects
    minutes: 85
    summary: Expose global state, reseeding, cloned workers, scheduling, endpoints, state, versions, and flaky-test failures.
    problem: "Find eight independent RNG causes, retain fail-before-fix evidence, and repair the stream architecture."
    requirements: ["Cover global state, internal reseeding, copied worker seeds, order-derived ids, wrong integer endpoint, seed-only late replay, missing version contract, and exact-frequency testing."]
    constraints: ["Do not solve by hard-coding sampled arrays.", "Do not weaken statistical assertions without deriving thresholds."]
    expectedBehaviour: ["Eight causes are proven.", "Subsystem and task replay remain isolated."]
    milestones: [{title: "1 — Map state", detail: "Find every constructor and consumer."}, {title: "2 — Regressions", detail: "Expose all eight causes."}, {title: "3 — Repair", detail: "Install explicit stream ownership."}]
    testing: ["Reorder scheduling and draw counts.", "Replay captured failure state."]
    failureCases: ["Using process id as stable identity.", "Treating one seed as full metadata."]
    bonus: ["Emit a stream topology report."]
    architectureHints: ["Version names and derivation rules."]
    referenceOutline: "Replace ambient and repeated construction with a root registry, named child streams, logical task derivation, recorded state, and layered tests."
resources:
  - {name: NumPy random Generator reference, type: docs, difficulty: core, url: "https://numpy.org/doc/stable/reference/random/generator.html", usefulness: 5, why: "It is the primary API contract for local Generator construction and distribution methods.", covers: "default_rng, Generator ownership, distributions, sampling, and state engine access."}
  - {name: NumPy parallel random generation, type: docs, difficulty: deep, url: "https://numpy.org/doc/stable/reference/random/parallel.html", usefulness: 5, why: "It directly addresses SeedSequence spawning and collision-resistant independent streams.", covers: "Spawning, multithreading, process safety, sequence ids, and unsafe approaches."}
  - {name: NumPy SeedSequence reference, type: docs, difficulty: deep, url: "https://numpy.org/doc/stable/reference/random/bit_generators/generated/numpy.random.SeedSequence.html", usefulness: 5, why: "It defines entropy mixing, spawn keys, child derivation, and reproducible state generation.", covers: "Entropy, spawn, spawn_key, pool size, and state generation."}
  - {name: NumPy BitGenerator reference, type: docs, difficulty: deep, url: "https://numpy.org/doc/stable/reference/random/bit_generators/index.html", usefulness: 5, why: "It distinguishes raw algorithms and state from the high-level distribution interface.", covers: "PCG64, Philox, SFC64, MT19937, seeding, state, and parallel features."}
  - {name: NumPy random compatibility policy, type: docs, difficulty: deep, url: "https://numpy.org/doc/stable/reference/random/compatibility.html", usefulness: 5, why: "It states what stream compatibility NumPy does and does not promise, preventing overclaims about seeds across versions.", covers: "BitGenerator guarantees, Generator distribution compatibility, and version policy."}
