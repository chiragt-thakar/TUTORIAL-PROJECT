    type: article
    difficulty: deep
    url: "https://arxiv.org/abs/1706.02677"
    usefulness: 5
    why: |
      Primary large-batch training work explaining gradual warmup and scaling in a concrete system.
    covers: |
      Warmup, large batches, distributed optimisation, scaling.
  - name: "Smith and Topin — Super-Convergence"
    type: article
    difficulty: deep
    url: "https://arxiv.org/abs/1708.07120"
    usefulness: 5
    why: |
      Primary source for the one-cycle policy and high learning-rate regularisation argument.
    covers: |
      One-cycle, cyclical rates, momentum, super-convergence.
