    type: article
    difficulty: core
    url: "https://arxiv.org/abs/1608.03983"
    usefulness: 5
    why: |
      Primary paper introducing cosine annealing with warm restarts and its exact schedule.
    covers: |
      Cosine annealing, restarts, schedules, experiments.
